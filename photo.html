<!-- ハンバーガーメニュー -->

  <main>

    <!-- ページタイトル -->

    <section class="page-title">

      <p class="page-label">
        TAKAKURA BASKETBALL CLUB
      </p>

      <h2>
        PHOTO
      </h2>

    </section>


    <!-- 写真 -->

    <section>

      <div class="photo-gallery">

        <div class="photo-item">
          <img
            src="IMG_7628.jpeg"
            alt="TAKAKURA BASKETBALL CLUB"
            onclick="openPhoto(0)">
        </div>

        <div class="photo-item">
          <img
            src="IMG_7629.jpeg"
            alt="TAKAKURA BASKETBALL CLUB"
            onclick="openPhoto(1)">
        </div>

        <div class="photo-item">
          <img
            src="IMG_7630.jpeg"
            alt="TAKAKURA BASKETBALL CLUB"
            onclick="openPhoto(2)">
        </div>

      </div>

    </section>


    <!-- Google Drive -->

    <section>

      <div class="drive-card">

        <div class="drive-icon">
          📁

  <!-- 写真拡大表示 -->

  <div
    id="photo-modal"
    class="photo-modal">

    <button
      class="photo-close"
      onclick="closePhoto()">
      ×
    </button>

    <button
      class="photo-prev"
      onclick="previousPhoto()">
      ‹
    </button>

    <img
      id="modal-image"
      src=""
      alt="拡大写真">

    <button
      class="photo-next"
      onclick="nextPhoto()">
      ›
    </button>

  </div>


  <!-- JavaScript -->

  <script>

    const photos = [
      "IMG_7628.jpeg",
      "IMG_7629.jpeg",
      "IMG_7630.jpeg"
    ];

    let currentPhoto = 0;


    function openPhoto(index) {

      currentPhoto = index;

      document.getElementById("modal-image").src =
        photos[currentPhoto];

      document.getElementById("photo-modal").style.display = "flex";

    }


    function closePhoto() {

      document.getElementById("photo-modal").style.display = "none";

    }


    function nextPhoto() {

      currentPhoto++;

      if (currentPhoto >= photos.length) {
        currentPhoto = 0;
      }

      document.getElementById("modal-image").src =
        photos[currentPhoto];

    }


    function previousPhoto() {

      currentPhoto--;

      if (currentPhoto < 0) {
        currentPhoto = photos.length - 1;
      }

      document.getElementById("modal-image").src =
        photos[currentPhoto];

    }


    /* スワイプ */

    let touchStartX = 0;
    let touchEndX = 0;


    const modal = document.getElementById("photo-modal");


    modal.addEventListener("touchstart", function(event) {

      touchStartX = event.changedTouches[0].screenX;

    });


    modal.addEventListener("touchend", function(event) {

      touchEndX = event.changedTouches[0].screenX;

      const distance = touchEndX - touchStartX;


      if (Math.abs(distance) < 50) {
        return;
      }


      if (distance < 0) {

        nextPhoto();

      } else {

        previousPhoto();

      }

    });

  </script>


  <!-- フッター -->

  <footer>

    </p>

<script>

  function toggleMenu() {

</script>
