<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>PHOTO | TAKAKURA BASKETBALL CLUB</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="icon"
    href="ED4C5B30-9C4A-443C-A6EE-A6A13FF634B4.jpeg">

  <link
    rel="apple-touch-icon"
    href="ED4C5B30-9C4A-443C-A6EE-A6A13FF634B4.jpeg">

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <h1>
      TAKAKURA BASKETBALL CLUB
    </h1>

    <button
      class="menu-button"
      onclick="toggleMenu()"
      aria-label="メニュー">

      ☰

    </button>

  </header>


  <!-- =========================
       MOBILE MENU
  ========================== -->

  <nav
    id="mobile-menu"
    class="mobile-menu">

    <a href="index.html">
      HOME
    </a>

    <a href="schedule.html">
      SCHEDULE
    </a>

    <a href="photo.html">
      PHOTO
    </a>

    <a href="news.html">
      NEWS
    </a>

    <a href="team.html">
      TEAM
    </a>

  </nav>


  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- =========================
         PAGE TITLE
    ========================== -->

    <section class="page-title">

      <p class="page-label">
        TAKAKURA BASKETBALL CLUB
      </p>

      <h2>
        PHOTO
      </h2>

    </section>


    <!-- =========================
         PHOTO GALLERY
    ========================== -->

    <section>

      <div class="photo-gallery">


        <div class="photo-item">
          
          <img
            src="IMG_7666.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(0)">

        </div>

        <div class="photo-item">

          <img
            src="IMG_7667.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(0)">

        </div>


        <div class="photo-item">

          <img
            src="IMG_7668.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(1)">

        </div>


        <div class="photo-item">

          <img
            src="IMG_7669.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(2)">

        </div>
        
        <div class="photo-item">
        
         <img
            src="IMG_7670.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(2)">

        </div> 
        
        <div class="photo-item">
        
         <img
            src="IMG_7671.jpeg"
            alt="TAKAKURA BASKETBALL CLUB チーム写真"
            onclick="openPhoto(2)">

        </div>
        

      </div>

    </section>


    <!-- =========================
         GOOGLE DRIVE
    ========================== -->

    <section>

      <div class="drive-card">

        <div class="drive-icon">
          📁
        </div>

        <h3>
          MORE PHOTOS
        </h3>

        <p>
          すべてのチーム写真は
          Google Driveで見ることができます。
        </p>

        <a
          href="https://drive.google.com/drive/folders/1C9hTGLXTgDpgsu9-LzJbwQTJBK5W1DLP"
          target="_blank"
          rel="noopener noreferrer"
          class="drive-button">

          VIEW ALL PHOTOS →

        </a>

      </div>

    </section>


    <!-- =========================
         BACK TO HOME
    ========================== -->

    <section class="back-home">

      <a
        href="index.html"
        class="view-all">

        ← BACK TO HOME

      </a>

    </section>


  </main>


  <!-- =========================
       PHOTO MODAL
  ========================== -->

  <div
    id="photo-modal"
    class="photo-modal">


    <!-- CLOSE -->

    <button
      class="photo-close"
      onclick="closePhoto()"
      aria-label="閉じる">

      ×

    </button>


    <!-- PREVIOUS -->

    <button
      class="photo-prev"
      onclick="previousPhoto()"
      aria-label="前の写真">

      ‹

    </button>


    <!-- IMAGE -->

    <img
      id="modal-image"
      src=""
      alt="拡大写真">


    <!-- NEXT -->

    <button
      class="photo-next"
      onclick="nextPhoto()"
      aria-label="次の写真">

      ›

    </button>


  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <p>
      © 2026 TAKAKURA BASKETBALL CLUB
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>

</html>
